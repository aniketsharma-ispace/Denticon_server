<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Insurance Scraper</title>
    <style>
        body {
            width: 250px;
            padding: 12px;
            margin: 0;
            font-family: Arial, sans-serif;
            color: #1f2937;
            background: #ffffff;
        }

        h3 {
            margin: 0 0 10px;
            font-size: 16px;
        }

        #status {
            min-height: 34px;
            margin: 0 0 10px;
            padding: 8px;
            font-size: 12px;
            line-height: 1.4;
            white-space: pre-wrap;
            color: #4b5563;
            background: #f5f7fa;
            border: 1px solid #e5e7eb;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            cursor: pointer;
            color: #ffffff;
            border: 0;
            border-radius: 4px;
            font-weight: 600;
        }

        button:disabled {
            cursor: wait;
            opacity: 0.65;
        }

        #btnDownload {
            background: #007bff;
        }

        #btnCrawl {
            background: #276299;
        }

        #btnGuardianCrawl {
            background: #007bff;
        }

        hr {
            margin: 10px 0;
            border: 0;
            border-top: 1px solid #e5e7eb;
        }
    </style>
</head>
<body>
    <h3 id="appTitle">Insurance Scraper</h3>
    <div id="status">Ready...</div>
    <button id="btnDownload" type="button">Download Captured JSON</button>
    <hr>
    <button id="btnCrawl" type="button">Crawl Full Insurance Plan</button>
    <script src="popup.js"></script>
</body>
</html>
